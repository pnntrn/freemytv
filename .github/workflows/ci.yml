name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Test package contents and configuration
        run: |
          python3 -m unittest discover -s tests -v
          node tests/cctv.test.js
          node tests/cctv-ui.test.js
          node tests/nvr-player.test.js
          bash -n build.sh
          for source in web/*.js; do node --check "$source"; done
      - name: Verify direct RTSP with real H.264 and HEVC decoding
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          node tests/nvr-direct.test.js
          NVR_TEST_HEVC=1 node tests/nvr-direct.test.js
      - name: Build unsigned Tizen package
        run: |
          python3 tizen/build.py --generic
          python3 tizen/module.py
      - uses: actions/upload-artifact@v4
        with:
          name: tizen-unsigned-${{ github.sha }}
          path: |
            FreeMyTV-tizen.wgt
            FreeMyTV-tizenbrew.zip
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install build tools
        run: sdkmanager 'build-tools;34.0.0' 'platforms;android-34'
      - name: Build APK with temporary CI signing key
        run: ./build.sh
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose FreeMyTV.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: android-temporary-key-${{ github.sha }}
          path: FreeMyTV.apk
          if-no-files-found: error
