name: Build release artifacts
on:
  push:
    branches: [main]
    paths: ['release/version.txt']
    tags: ['custom-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'build-tools;34.0.0' 'platforms;android-34'
      - name: Test and build packages
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          node tests/cctv.test.js
          node tests/cctv-ui.test.js
          node tests/youtube-home.test.js
          bash -n build.sh
          for source in web/*.js; do node --check "$source"; done
          mkdir packages
          if [ -n "$APK_KEYSTORE_BASE64$APK_STORE_PASSWORD$APK_KEY_PASSWORD$APK_KEY_ALIAS" ]; then
            : "${APK_KEYSTORE_BASE64:?Incomplete signing secrets}"
            : "${APK_STORE_PASSWORD:?Incomplete signing secrets}"
            : "${APK_KEY_PASSWORD:?Incomplete signing secrets}"
            : "${APK_KEY_ALIAS:?Incomplete signing secrets}"
            export APK_KEYSTORE="$RUNNER_TEMP/release.keystore"
            trap 'rm -f "$APK_KEYSTORE"' EXIT
            printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$APK_KEYSTORE"
            ./build.sh
            cp FreeMyTV.apk packages/FreeMyTV.apk
            echo 'Android: signed with the configured persistent key.' > packages/BUILD_INFO.txt
          else
            unset APK_STORE_PASSWORD APK_KEY_PASSWORD APK_KEY_ALIAS
            ./build.sh
            cp FreeMyTV.apk packages/FreeMyTV-test.apk
            echo 'Android: TEST ONLY, temporary signing key. Future builds may require uninstalling (erases app data).' > packages/BUILD_INFO.txt
          fi
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs FreeMyTV.apk >> packages/BUILD_INFO.txt
          python3 tizen/build.py --generic
          python3 tizen/module.py
          cp FreeMyTV-tizen.wgt FreeMyTV-tizenbrew.zip packages/
          cp LICENSE packages/LICENSE
          cp release/NOTES.md packages/INSTALL.md
          echo "Source commit: $GITHUB_SHA" >> packages/BUILD_INFO.txt
          echo 'Tizen WGT: unsigned; installation/signing on hardware is unverified.' >> packages/BUILD_INFO.txt
          cd packages
          sha256sum FreeMyTV* BUILD_INFO.txt INSTALL.md LICENSE > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: packages/*
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/custom-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Publish release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$(tr -d '\r\n' < release/version.txt)"
          [[ "$TAG" =~ ^custom-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version'; exit 1; }
          if [ "$REF_TYPE" = tag ]; then
            [ "$REF_NAME" = "$TAG" ] || { echo 'Tag must match release/version.txt'; exit 1; }
          fi
          gh release create "$TAG" packages/* --target "$GITHUB_SHA" --latest \
            --title "Free My TV Surin ${TAG#custom-v} — experimental" --notes-file release/NOTES.md
